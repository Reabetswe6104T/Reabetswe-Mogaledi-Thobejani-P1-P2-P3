name: Part 2 CI
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore Part2/RaceDayAPI/RaceDayAPI.csproj
    - name: Build
      run: dotnet build Part2/RaceDayAPI/RaceDayAPI.csproj --no-restore
